<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ZEUS-POC Agent Chat</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: #0f1117;
    color: #e0e0e0;
    height: 100vh;
    display: flex;
    flex-direction: column;
  }
  header {
    background: #1a1d28;
    padding: 14px 20px;
    border-bottom: 1px solid #2a2d3a;
    display: flex;
    align-items: center;
    gap: 12px;
  }
  header .dot {
    width: 10px; height: 10px; border-radius: 50%;
    background: #22c55e;
    box-shadow: 0 0 6px #22c55e88;
  }
  header h1 { font-size: 16px; font-weight: 600; }
  header .status { margin-left: auto; font-size: 12px; color: #888; }
  #chat {
    flex: 1;
    overflow-y: auto;
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .msg {
    max-width: 72%;
    padding: 10px 14px;
    border-radius: 12px;
    line-height: 1.45;
    font-size: 14px;
    white-space: pre-wrap;
    word-wrap: break-word;
  }
  .msg.user {
    align-self: flex-end;
    background: #3b82f6;
    color: #fff;
    border-bottom-right-radius: 4px;
  }
  .msg.agent {
    align-self: flex-start;
    background: #1e2030;
    border: 1px solid #2a2d3a;
    border-bottom-left-radius: 4px;
  }
  .msg.error {
    align-self: center;
    background: #7f1d1d;
    color: #fca5a5;
    font-size: 12px;
  }
  #input-area {
    background: #1a1d28;
    padding: 14px 20px;
    border-top: 1px solid #2a2d3a;
    display: flex;
    gap: 10px;
  }
  #input-area input {
    flex: 1;
    background: #0f1117;
    border: 1px solid #2a2d3a;
    color: #e0e0e0;
    padding: 10px 14px;
    border-radius: 8px;
    font-size: 14px;
    outline: none;
  }
  #input-area input:focus { border-color: #3b82f6; }
  #input-area button {
    background: #3b82f6;
    color: #fff;
    border: none;
    padding: 10px 20px;
    border-radius: 8px;
    font-size: 14px;
    cursor: pointer;
    font-weight: 500;
  }
  #input-area button:disabled { opacity: 0.5; cursor: not-allowed; }
  #input-area button:hover:not(:disabled) { background: #2563eb; }
</style>
</head>
<body>

<header>
  <div class="dot" id="status-dot"></div>
  <h1>ZEUS-POC</h1>
  <span class="status" id="conn-status">connecting...</span>
</header>

<div id="chat"></div>

<div id="input-area">
  <input id="msg" type="text" placeholder="Type a message..." autocomplete="off" />
  <button id="send" disabled>Send</button>
</div>

<script>
(function() {
  const chat = document.getElementById('chat');
  const input = document.getElementById('msg');
  const btn = document.getElementById('send');
  const dot = document.getElementById('status-dot');
  const connStatus = document.getElementById('conn-status');
  let ws;
  let reconnectDelay = 1000;

  function connect() {
    const proto = location.protocol === 'https:' ? 'wss' : 'ws';
    ws = new WebSocket(`${proto}://${location.host}/ws`);

    ws.onopen = function() {
      btn.disabled = false;
      dot.style.background = '#22c55e';
      dot.style.boxShadow = '0 0 6px #22c55e88';
      connStatus.textContent = 'connected';
      reconnectDelay = 1000;
    };

    ws.onclose = function() {
      btn.disabled = true;
      dot.style.background = '#ef4444';
      dot.style.boxShadow = '0 0 6px #ef444488';
      connStatus.textContent = 'disconnected';
      setTimeout(connect, reconnectDelay);
      reconnectDelay = Math.min(reconnectDelay * 2, 15000);
    };

    ws.onerror = function() {
      ws.close();
    };

    ws.onmessage = function(evt) {
      try {
        const data = JSON.parse(evt.data);
        addMessage(data.reply, 'agent');
      } catch(e) {
        addMessage('Failed to parse response', 'error');
      }
      btn.disabled = false;
      input.disabled = false;
      input.focus();
    };
  }

  function addMessage(text, cls) {
    const div = document.createElement('div');
    div.className = 'msg ' + cls;
    div.textContent = text;
    chat.appendChild(div);
    chat.scrollTop = chat.scrollHeight;
  }

  function send() {
    const text = input.value.trim();
    if (!text || !ws || ws.readyState !== WebSocket.OPEN) return;
    addMessage(text, 'user');
    ws.send(JSON.stringify({ sender: 'user', text: text }));
    input.value = '';
    btn.disabled = true;
    input.disabled = true;
  }

  btn.addEventListener('click', send);
  input.addEventListener('keydown', function(e) {
    if (e.key === 'Enter') send();
  });

  connect();
})();
</script>
</body>
</html>
